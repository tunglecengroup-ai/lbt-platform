# Netlify tự nhận Next.js (adapter OpenNext) — file này chỉ chốt lệnh build + phiên bản Node
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # Biến NEXT_PUBLIC_* vốn được nhúng vào code trình duyệt — không phải bí mật, bỏ qua khi Netlify quét lộ khóa
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_SITE_URL,NEXT_PUBLIC_MARKETING_URL,NEXT_PUBLIC_LEARN_URL,NEXT_PUBLIC_COOKIE_DOMAIN,NEXT_PUBLIC_GA4_ID,NEXT_PUBLIC_META_PIXEL_ID"
  # Từ 10/11/2026: toàn bộ web (quảng bá + học + admin) chạy ở hoc.lebatung.com; lebatung.com quay về Webcake.
  # Muốn tách lại 2 tên miền: thêm NEXT_PUBLIC_MARKETING_URL + NEXT_PUBLIC_LEARN_URL (xem src/lib/site.ts)
  NEXT_PUBLIC_SITE_URL = "https://hoc.lebatung.com"
  # Giữ cookie đăng nhập chung .lebatung.com (học viên đang đăng nhập không bị văng ra)
  NEXT_PUBLIC_COOKIE_DOMAIN = ".lebatung.com"
  # Đo lường (ID công khai, không phải bí mật). Mã Conversions API (META_CAPI_TOKEN) là BÍ MẬT -> chỉ đặt trong Netlify UI
  NEXT_PUBLIC_GA4_ID = "G-B81YLXM1Y4"
  NEXT_PUBLIC_META_PIXEL_ID = "923089499957337"
