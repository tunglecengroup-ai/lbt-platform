# Netlify tự nhận Next.js (adapter OpenNext) — file này chỉ chốt lệnh build + phiên bản Node
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # Biến NEXT_PUBLIC_* vốn được nhúng vào code trình duyệt — không phải bí mật, bỏ qua khi Netlify quét lộ khóa
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_SITE_URL,NEXT_PUBLIC_MARKETING_URL,NEXT_PUBLIC_LEARN_URL,NEXT_PUBLIC_GA4_ID,NEXT_PUBLIC_META_PIXEL_ID"
  # Tách 2 tên miền (xem src/lib/site.ts): quảng bá ở lebatung.com, học + admin ở hoc.lebatung.com
  NEXT_PUBLIC_MARKETING_URL = "https://lebatung.com"
  NEXT_PUBLIC_LEARN_URL = "https://hoc.lebatung.com"
  # Đo lường (ID công khai, không phải bí mật). Mã Conversions API (META_CAPI_TOKEN) là BÍ MẬT -> chỉ đặt trong Netlify UI
  NEXT_PUBLIC_GA4_ID = "G-B81YLXM1Y4"
  NEXT_PUBLIC_META_PIXEL_ID = "923089499957337"
